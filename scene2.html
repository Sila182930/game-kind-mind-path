<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            background-color: black;
            font-family: "Noto Sans Thai", Kanit, sans-serif;
        }

        .bg {
            position: fixed;
            z-index: -1;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
        }

        .character-menu {
            position: absolute;
            z-index: 3;
            top: 34%;
            right: 7%;
            display: grid;
            width: min(34vw, 410px);
            gap: 18px;
        }

        .gender-panel {
            position: relative;
            box-sizing: border-box;
            padding: 12px 14px 14px;
            border: 2px solid #d6ad61;
            border-radius: 14px;
            color: #fff3d4;
            background:
                radial-gradient(ellipse at top, rgba(142, 96, 43, 0.42), transparent 70%),
                linear-gradient(145deg, rgba(43, 29, 19, 0.96), rgba(17, 14, 12, 0.96));
            box-shadow: 0 0 0 4px rgba(50, 34, 20, 0.78), 0 0 24px rgba(255, 202, 105, 0.36);
            backdrop-filter: blur(3px);
        }

        .gender-panel::before {
            position: absolute;
            inset: 5px;
            border: 1px solid rgba(245, 209, 127, 0.35);
            border-radius: 9px;
            content: "";
            pointer-events: none;
        }

        .gender-title {
            position: relative;
            margin: 0 0 10px 4px;
            color: #f5d17f;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.4;
            text-shadow: 0 0 10px rgba(245, 209, 127, 0.4);
        }

        .gender-options {
            position: relative;
            display: flex;
            gap: 8px;
        }

        .gender-option {
            flex: 1;
            min-width: 0;
            padding: 0;
            border: 0;
            border-radius: 9px;
            background: transparent;
            cursor: pointer;
            transition: transform 180ms ease, filter 180ms ease;
        }

        .gender-option img {
            display: block;
            width: 100%;
            height: auto;
        }

        .gender-option:hover {
            filter: brightness(1.12);
        }

        .girl.selected,
        .boy.selected {
            transform: scale(1.04);
            filter: drop-shadow(0 0 7px #fff) drop-shadow(0 0 14px #ffe875);
        }

        .start {
            display: block;
            width: 100%;
            max-width: 410px;
            margin: 0 auto;
            padding: 0;
            border: 0;
            background: transparent;
            cursor: pointer;
            transition: transform 180ms ease, filter 180ms ease;
        }

        .start img {
            display: block;
            width: 100%;
            height: auto;
        }

        .start:hover,
        .start:focus-visible {
            transform: scale(1.04);
            filter: drop-shadow(0 0 7px #fff) drop-shadow(0 0 14px #ffe875);
        }

        .gender-option:focus-visible,
        .start:focus-visible {
            outline: 3px solid #ffe875;
            outline-offset: 3px;
        }

        .character-preview {
            position: absolute;
            z-index: 2;
            left: 28%;
            bottom: 0;
            height: 58vh;
            width: auto;
            max-width: 32vw;
            object-fit: contain;
            pointer-events: none;
            filter: drop-shadow(0 0 12px rgba(255, 215, 120, 0.8));
            animation: reveal-character 400ms ease-out both;
        }

        @keyframes reveal-character {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .name-modal[hidden],
        .selection-warning[hidden] {
            display: none;
        }

        .name-modal {
            position: fixed;
            z-index: 10;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 20px;
            background: rgba(15, 10, 8, 0.76);
            backdrop-filter: blur(5px);
        }

        .name-panel {
            position: relative;
            box-sizing: border-box;
            width: min(100%, 460px);
            padding: 38px 36px 32px;
            border: 2px solid #e4b85e;
            border-radius: 18px;
            color: #fff3d4;
            text-align: center;
            background:
                radial-gradient(ellipse at top, rgba(151, 94, 37, 0.45), transparent 58%),
                linear-gradient(145deg, #342016, #17110e 72%);
            box-shadow: 0 0 0 5px rgba(72, 43, 21, 0.9), 0 0 38px rgba(255, 190, 75, 0.38);
        }

        .name-panel::before,
        .name-panel::after {
            position: absolute;
            left: 50%;
            color: #f5d17f;
            content: "✦";
            transform: translateX(-50%);
        }

        .name-panel::before {
            top: 10px;
        }

        .name-panel::after {
            bottom: 8px;
        }

        .name-close {
            position: absolute;
            top: 10px;
            right: 12px;
            width: 34px;
            height: 34px;
            border: 1px solid rgba(255, 226, 164, 0.45);
            border-radius: 50%;
            color: #ffedc5;
            font-size: 22px;
            line-height: 1;
            background: rgba(0, 0, 0, 0.28);
            cursor: pointer;
        }

        .name-panel h1 {
            margin: 8px 0 10px;
            color: #f5d17f;
            font: 700 28px/1.3 Georgia, "Noto Sans Thai", serif;
        }

        .name-panel p {
            margin-bottom: 24px;
            color: #e4d1ad;
            font: 16px/1.6 "Noto Sans Thai", Kanit, sans-serif;
        }

        .name-panel label {
            display: block;
            margin-bottom: 8px;
            color: #f5d17f;
            text-align: left;
            font: 600 15px/1.5 "Noto Sans Thai", Kanit, sans-serif;
        }

        .name-panel input {
            box-sizing: border-box;
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #bd914a;
            border-radius: 8px;
            outline: none;
            color: #fff6e3;
            font: 16px "Noto Sans Thai", Kanit, sans-serif;
            background: rgba(10, 8, 7, 0.72);
        }

        .name-panel input:focus {
            border-color: #ffe294;
            box-shadow: 0 0 0 3px rgba(255, 213, 122, 0.2);
        }

        .name-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 24px;
        }

        .name-actions button {
            min-height: 44px;
            padding: 9px 18px;
            border-radius: 8px;
            font: 600 15px "Noto Sans Thai", Kanit, sans-serif;
            cursor: pointer;
        }

        .name-cancel {
            border: 1px solid #8e7657;
            color: #eadcc3;
            background: #30251d;
        }

        .name-submit {
            border: 1px solid #ffe29a;
            color: #34200b;
            background: linear-gradient(#ffe69e, #d99a37);
            box-shadow: 0 3px 12px rgba(231, 167, 60, 0.3);
        }

        .name-actions button:hover,
        .name-close:hover {
            filter: brightness(1.15);
        }

        .selection-warning {
            justify-self: center;
            padding: 10px 16px;
            border: 1px solid #e4b85e;
            border-radius: 10px;
            color: #fff3d4;
            font: 15px "Noto Sans Thai", Kanit, sans-serif;
            background: rgba(35, 23, 14, 0.94);
            box-shadow: 0 0 18px rgba(255, 190, 75, 0.25);
        }

        @media (max-width: 700px) {
            .character-menu {
                top: auto;
                right: 4%;
                bottom: 5%;
                width: min(52vw, 340px);
                gap: 12px;
            }

            .character-preview {
                left: 7%;
                height: 43vh;
                max-width: 38vw;
            }

            .name-panel {
                padding: 36px 22px 30px;
            }

            .selection-warning {
                font-size: 13px;
            }
        }
        </style>
</head>
<body>
    <img class="bg" src="background/02_Create_Character/BG.jpg" alt="Scene 2">
    <main class="character-menu" aria-label="สร้างตัวละคร">
        <section class="gender-panel" aria-labelledby="genderTitle">
            <h1 class="gender-title" id="genderTitle">เลือกเพศ</h1>
            <div class="gender-options">
                <button class="gender-option girl" type="button" aria-label="เลือกเพศหญิง" aria-pressed="false">
                    <img src="background/02_Create_Character/Girl.png" alt="">
                </button>
                <button class="gender-option boy" type="button" aria-label="เลือกเพศชาย" aria-pressed="false">
                    <img src="background/02_Create_Character/Boy.png" alt="">
                </button>
            </div>
        </section>
        <button class="start" type="button" aria-label="เริ่มการผจญภัย">
            <img src="background/02_Create_Character/Start.png" alt="">
        </button>
        <p class="selection-warning" id="selectionWarning" role="alert" hidden>กรุณาเลือกเพศก่อน</p>
    </main>
    <img class="character-preview" id="characterPreview" alt="" hidden>
    <div class="name-modal" id="nameModal" role="dialog" aria-modal="true" aria-labelledby="nameTitle" aria-describedby="nameDescription" hidden>
        <form class="name-panel" id="nameForm">
            <button class="name-close" id="closeNameModal" type="button" aria-label="ปิดหน้าต่าง">×</button>
            <h1 id="nameTitle">ตั้งชื่อนักผจญภัย</h1>
            <p id="nameDescription">จารึกชื่อของคุณลงในตำนาน ก่อนออกเดินทางสู่โลกแฟนตาซี</p>
            <label for="characterName">ชื่อตัวละคร</label>
            <input id="characterName" name="characterName" type="text" maxlength="24" placeholder="พิมพ์ชื่อที่ต้องการ..." autocomplete="off" required>
            <div class="name-actions">
                <button class="name-cancel" id="cancelName" type="button">ย้อนกลับ</button>
                <button class="name-submit" type="submit">ยืนยันชื่อ</button>
            </div>
        </form>
    </div>
    <script>
        const characters = document.querySelectorAll(".girl, .boy");
        const characterPreview = document.getElementById("characterPreview");
        const startImage = document.querySelector(".start");
        const nameModal = document.getElementById("nameModal");
        const nameForm = document.getElementById("nameForm");
        const characterName = document.getElementById("characterName");
        const selectionWarning = document.getElementById("selectionWarning");

        function selectCharacter(character) {
            characters.forEach((image) => {
                const isSelected = image === character;
                image.classList.toggle("selected", isSelected);
                image.setAttribute("aria-pressed", String(isSelected));
            });
            selectionWarning.hidden = true;
            const selectedCharacter = character.classList.contains("girl") ? "Girl" : "Boy";
            characterPreview.src = `character/01_Create_Character/C_${selectedCharacter}.png`;
            characterPreview.alt = `${selectedCharacter} character preview`;
            characterPreview.hidden = false;
        }

        characters.forEach((character) => {
            character.addEventListener("click", () => selectCharacter(character));
        });

        function openNameModal() {
            const hasSelectedCharacter = Array.from(characters).some((character) => character.classList.contains("selected"));
            if (!hasSelectedCharacter) {
                selectionWarning.hidden = false;
                return;
            }
            nameModal.hidden = false;
            characterName.focus();
        }

        function closeNameModal() {
            nameModal.hidden = true;
            startImage.focus();
        }

        startImage.addEventListener("click", openNameModal);

        document.getElementById("closeNameModal").addEventListener("click", closeNameModal);
        document.getElementById("cancelName").addEventListener("click", closeNameModal);
        nameModal.addEventListener("click", (event) => {
            if (event.target === nameModal) {
                closeNameModal();
            }
        });
        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && !nameModal.hidden) {
                closeNameModal();
            }
        });
        nameForm.addEventListener("submit", (event) => {
            event.preventDefault();
            const playerName = characterName.value.trim();
            if (!playerName) {
                characterName.focus();
                return;
            }
            window.location.href = `scene3.html?playerName=${encodeURIComponent(playerName)}`;
        });
    </script>
</body>

</html>
